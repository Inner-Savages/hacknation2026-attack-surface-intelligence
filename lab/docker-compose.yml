# Minimalny lab dla Attack Surface Intelligence.
# Sieć 172.28.0.0/24 z nazwanym mostem br-asilab: sensor pasywny nasłuchuje na hoście
# na tym interfejsie, a nmap z hosta widzi całą podsieć bez mapowania portów.
name: asi-lab

networks:
  lab:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-asilab
    ipam:
      config:
        - subnet: 172.28.0.0/24

services:
  web-plain:
    image: nginx:alpine
    networks: { lab: { ipv4_address: 172.28.0.10 } }
    volumes:
      - ./plain:/usr/share/nginx/html:ro

  web-cms:            # imitacja WordPressa: meta generator, ciasteczko, /wp-login.php
    image: nginx:alpine
    networks: { lab: { ipv4_address: 172.28.0.11 } }
    volumes:
      - ./cms:/usr/share/nginx/html:ro
      - ./nginx/cms.conf:/etc/nginx/conf.d/default.conf:ro

  web-staging:        # środowisko testowe: nagłówek X-Env, tytuł "STAGING", /admin
    image: nginx:alpine
    networks: { lab: { ipv4_address: 172.28.0.12 } }
    volumes:
      - ./staging:/usr/share/nginx/html:ro
      - ./nginx/staging.conf:/etc/nginx/conf.d/default.conf:ro

  flapper:            # host niestabilny: usługa działa FLAP_UP s, potem milczy FLAP_DOWN s
    image: nginx:alpine
    networks: { lab: { ipv4_address: 172.28.0.20 } }
    environment:
      FLAP_UP: "300"
      FLAP_DOWN: "300"
    volumes:
      - ./scripts/flap.sh:/flap.sh:ro
    entrypoint: ["sh", "/flap.sh"]

  client:             # generator ruchu: bez niego sensor pasywny nie ma czego obserwować
    image: alpine:3
    networks: { lab: { ipv4_address: 172.28.0.100 } }
    volumes:
      - ./scripts/client.sh:/client.sh:ro
    entrypoint: ["sh", "/client.sh"]
