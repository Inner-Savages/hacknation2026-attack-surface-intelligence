# Nakładka na docker-compose-custom-network.yml z szablonów CBI AGH.
#
#   docker compose -f lab/agh/upstream/docker-compose-custom-network.yml \
#                  -f lab/agh/traffic-custom-network.yml up -d
#   docker compose -f ... -f ... logs -f sensor      # zdarzenia sensora
#   docker compose -f ... -f ... logs -f trigger     # skany wzbudzone przez sensor
#
# Pliki AGH (lab/agh/upstream/) zostają bez zmian; bez tej nakładki stack działa
# dokładnie jak u AGH. Nakładka nie używa żadnych lokalnych ścieżek (compose liczy
# je względem katalogu PIERWSZEGO pliku), tylko gotowych obrazów, więc działa też
# z kopią szablonów trzymaną gdzie indziej.
#
# Dodaje (wyłącznie nowe usługi; definicji usług i sieci AGH nie zmienia):
#   - traffic: łagodny ruch w tle (GET-y, połączenia z odczytem bannera), bez logowań,
#   - flapper: host niestabilny, usługa HTTP działa FLAP_UP s, milczy FLAP_DOWN s,
#   - sensor: pasywny sensor na wszystkich mostach Dockera (`-i 'br-*'`), sieć hosta,
#     tylko CAP_NET_RAW; zdarzenia wysyła webhookiem do triggera,
#   - trigger: na zdarzenia sensora odpala celowane skany (nmap -sT + prober +
#     sygnatury) tylko w sieciach Dockera (172.16.0.0/12); znaleziska w logach i
#     w wolumenie trigger-data (findings.jsonl). Słucha tylko na 127.0.0.1:8099.
#
# Nakładka celowo nie nadaje sieciom AGH własnych nazw mostów: wtedy compose
# uruchomiony bez nakładki (np. ich quickstart.sh) widzi inną definicję sieci,
# próbuje ją odtworzyć i psuje działający stack.

services:
  traffic:
    image: ${SOTW_IMAGE_PREFIX:-ghcr.io/inner-savages/silence-on-the-wire}/traffic:${SOTW_TAG:-latest}
    restart: unless-stopped
    networks: [frontend, backend]
    environment:
      INTERVAL: ${TRAFFIC_INTERVAL:-10s}
      TARGETS: >-
        http://custom-api/get
        http://flask-app/
        http://gitea:3000/
        tcp://gitea:22
        http://rabbitmq:15672/
        tcp://rabbitmq:5672
        tcp://postgres:5432
        http://flapper/

  flapper:
    image: nginx:alpine
    restart: unless-stopped
    networks: [backend]
    environment:
      FLAP_UP: ${FLAP_UP:-60}
      FLAP_DOWN: ${FLAP_DOWN:-60}
    entrypoint: ["sh", "-c"]
    command:
      - |
        while true; do
          nginx; echo "flapper: UP for $${FLAP_UP}s"; sleep "$${FLAP_UP}"
          nginx -s stop; echo "flapper: DOWN for $${FLAP_DOWN}s"; sleep "$${FLAP_DOWN}"
        done

  sensor:
    image: ${SOTW_IMAGE_PREFIX:-ghcr.io/inner-savages/silence-on-the-wire}/sensor:${SOTW_TAG:-latest}
    restart: unless-stopped
    network_mode: host
    cap_drop: [ALL]
    cap_add: [NET_RAW]
    command:
      - -i
      - br-*
      - -learn
      - ${SENSOR_LEARN:-30s}
      - -silent-after
      - ${SENSOR_SILENT_AFTER:-60s}
      - -name
      - agh-lab
      - -webhook
      - http://127.0.0.1:8099/events
    environment:
      SOTW_WEBHOOK_TOKEN: ${SOTW_WEBHOOK_TOKEN:-agh-lab-token}
    volumes:
      - sensor-data:/data
    # Mosty powstają razem z sieciami stacku; sensor startuje po kontenerach,
    # które ich używają, więc wzorzec br-* już je widzi.
    depends_on: [traffic, flapper, trigger]

  trigger:
    image: ${SOTW_IMAGE_PREFIX:-ghcr.io/inner-savages/silence-on-the-wire}/trigger:${SOTW_TAG:-latest}
    restart: unless-stopped
    # Sieć hosta: dociera do kontenerów na każdym moście, a jej własne adresy
    # (bramy mostów) są ignorowane jako źródło ruchu skanera.
    network_mode: host
    cap_drop: [ALL] # nmap -sT nie potrzebuje żadnych uprawnień
    command:
      - -allow
      - 172.16.0.0/12
      - -listen
      - 127.0.0.1:8099
    environment:
      SOTW_WEBHOOK_TOKEN: ${SOTW_WEBHOOK_TOKEN:-agh-lab-token}
    volumes:
      - trigger-data:/data

volumes:
  sensor-data:
  trigger-data:
