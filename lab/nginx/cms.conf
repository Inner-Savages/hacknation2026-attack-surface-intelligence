server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    add_header Set-Cookie "wordpress_test_cookie=WP%20Cookie%20check; path=/" always;
    add_header X-Powered-By "PHP/8.1.2" always;
    add_header Link '<http://web-cms/wp-json/>; rel="https://api.w.org/"' always;
    location / { try_files $uri $uri/ =404; }
}
