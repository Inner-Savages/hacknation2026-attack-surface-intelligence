<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Silence on the Wire — konsola operatora</title>
<style>
:root {
  --bg: #f4f5f6; --panel: #ffffff; --panel-2: #fafbfc; --border: #dde1e6; --border-strong: #c9cfd6;
  --text: #1c2430; --muted: #67707c; --faint: #9aa3ad;
  --accent: #0e9e6e; --accent-soft: #e3f5ee; --accent-text: #0a7a56;
  --warn: #b97a17; --warn-soft: #fbf1de;
  --danger: #c63e3e; --danger-soft: #fbe7e7;
  --info: #3165c9; --info-soft: #e6eefb;
  --mono: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
  --shadow: 0 1px 2px rgba(20,30,45,.06);
  --skeleton: #e8ebee;
}
html[data-theme="dark"] {
  --bg: #0a0f1a; --panel: #101827; --panel-2: #0d1420; --border: #1c2942; --border-strong: #2a3a58;
  --text: #c9d4e5; --muted: #7c8aa0; --faint: #4d5b72;
  --accent: #35c48d; --accent-soft: #0f2b22; --accent-text: #5ad8a8;
  --warn: #e8a13c; --warn-soft: #2e2410;
  --danger: #e05c5c; --danger-soft: #331616;
  --info: #6f9be8; --info-soft: #152238;
  --shadow: none;
  --skeleton: #16202f;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font: 14px/1.5 -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; }
button { font: inherit; cursor: pointer; }
input, select, textarea { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
a { color: var(--info); text-decoration: none; }

.topbar { display: flex; align-items: center; gap: 16px; padding: 0 24px; height: 56px; background: var(--panel); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 10; }
.brand { display: flex; align-items: baseline; gap: 10px; }
.brand .logo { color: var(--accent); font-size: 18px; }
.brand b { font-size: 15px; letter-spacing: .2px; }
.brand span { color: var(--muted); font-size: 12px; }
.topbar .spacer { flex: 1; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--border); font-size: 12px; color: var(--muted); background: var(--panel-2); }
.pill .dot { width: 7px; height: 7px; border-radius: 50%; }
.dot.green { background: var(--accent); } .dot.red { background: var(--danger); } .dot.orange { background: var(--warn); } .dot.gray { background: var(--faint); }
.demo-badge { border: 1px dashed var(--warn); color: var(--warn); padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: 600; letter-spacing: .8px; }
.clock { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.user { display: flex; align-items: center; gap: 8px; font-size: 13px; }
.avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--info-soft); color: var(--info); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 11px; border: 1px solid var(--border); }
.theme-toggle { background: none; border: 1px solid var(--border); border-radius: 8px; width: 34px; height: 34px; font-size: 15px; color: var(--muted); }
.theme-toggle:hover { color: var(--text); border-color: var(--border-strong); }

.tabs { display: flex; gap: 4px; padding: 12px 24px 0; }
.tab { padding: 8px 16px; border-radius: 8px 8px 0 0; border: 1px solid transparent; border-bottom: none; color: var(--muted); background: none; font-weight: 500; }
.tab.active { color: var(--text); background: var(--panel); border-color: var(--border); }
.page { padding: 0 24px 48px; }
.panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow); }

.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin: 16px 0; }
.card { padding: 14px 16px; }
.card .label { font-size: 11px; letter-spacing: .8px; color: var(--muted); display: flex; align-items: center; gap: 6px; font-weight: 600; }
.card .value { font-size: 30px; font-weight: 700; margin-top: 4px; }
.card .sub { font-size: 11px; color: var(--faint); margin-top: 2px; }

.filters { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin: 16px 0 12px; }
.filters input[type="search"] { min-width: 260px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--accent); color: var(--accent-text); background: var(--accent-soft); font-size: 12px; }
.chip button { background: none; border: none; color: inherit; font-weight: 700; }

.banner { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 10px; border: 1px solid var(--danger); background: var(--danger-soft); color: var(--danger); margin: 16px 0; }
.banner .grow { flex: 1; color: var(--text); }
.banner small { color: var(--muted); display: block; }
.btn { padding: 8px 16px; border-radius: 8px; border: 1px solid var(--border); background: var(--panel); color: var(--text); font-weight: 500; }
.btn:hover { border-color: var(--border-strong); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { border-color: var(--danger); color: var(--danger); background: none; }
.btn.danger.armed { background: var(--danger); color: #fff; }
.btn:disabled { opacity: .5; cursor: default; }

table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-size: 11px; letter-spacing: .8px; color: var(--muted); font-weight: 600; padding: 10px 14px; border-bottom: 1px solid var(--border); }
td { padding: 11px 14px; border-bottom: 1px solid var(--border); font-size: 13px; }
tr:last-child td { border-bottom: none; }
tbody tr { cursor: pointer; }
tbody tr:hover { background: var(--panel-2); }
.mono { font-family: var(--mono); font-size: 12.5px; }
.muted { color: var(--muted); }
.score { font-family: var(--mono); font-weight: 600; }
.badge { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 11px; font-weight: 600; letter-spacing: .4px; }
.badge.nowe { background: var(--accent-soft); color: var(--accent-text); }
.badge.do_weryfikacji { background: var(--warn-soft); color: var(--warn); }
.badge.potwierdzony { background: var(--danger-soft); color: var(--danger); }
.badge.falszywy_alarm { background: var(--info-soft); color: var(--info); }
.badge.zamkniety { background: var(--panel-2); color: var(--muted); border: 1px solid var(--border); }

.pager { display: flex; align-items: center; gap: 12px; justify-content: flex-end; padding: 12px 14px; color: var(--muted); font-size: 12px; }
.pager button { padding: 5px 12px; }

.empty { text-align: center; padding: 80px 20px; }
.empty .waves { color: var(--faint); margin-bottom: 16px; }
.empty h3 { font-size: 18px; margin-bottom: 8px; }
.empty p { color: var(--muted); margin-bottom: 20px; }

.skeleton { padding: 16px; }
.sk { background: var(--skeleton); border-radius: 6px; height: 16px; margin: 12px; animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .45; } }

.detail { display: grid; grid-template-columns: 1fr 420px; gap: 16px; margin-top: 16px; align-items: start; }
@media (max-width: 1100px) { .detail { grid-template-columns: 1fr; } }
.detail .panel { padding: 18px; }
.detail h4 { font-size: 11px; letter-spacing: 1px; color: var(--muted); margin-bottom: 12px; }
.kv { display: grid; grid-template-columns: 140px 1fr; row-gap: 6px; font-size: 13px; margin-bottom: 14px; }
.kv dt { color: var(--muted); } .kv dd { font-family: var(--mono); font-size: 12.5px; word-break: break-all; }
.score-row { display: grid; grid-template-columns: 70px 1fr 60px 60px; gap: 10px; align-items: center; margin: 8px 0; font-size: 12.5px; }
.score-row .bar { height: 8px; background: var(--panel-2); border: 1px solid var(--border); border-radius: 4px; overflow: hidden; }
.score-row .bar i { display: block; height: 100%; background: var(--accent); }
.note-box textarea { width: 100%; min-height: 70px; resize: vertical; margin-bottom: 10px; }
.status-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 12px 0; }
.status-grid .btn.sel { border-color: var(--warn); color: var(--warn); background: var(--warn-soft); }
.actions { display: grid; gap: 8px; margin-top: 12px; }
.fineprint { font-size: 11.5px; color: var(--faint); margin-top: 8px; }
.history { margin-top: 4px; }
.history .hrow { display: flex; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
.history .hrow:last-child { border-bottom: none; }
.history .hdot { margin-top: 6px; }
.history .hmeta { color: var(--faint); font-size: 11.5px; font-family: var(--mono); }
.features { margin-top: 10px; }
.features summary { cursor: pointer; color: var(--info); font-size: 13px; }
.features table { margin-top: 8px; }
.features td { padding: 5px 10px; font-size: 12px; }
.loading-line { padding: 24px; color: var(--muted); display: flex; align-items: center; gap: 10px; }
.spinner { width: 16px; height: 16px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.feed-toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 16px 0 12px; }
.feed { max-height: 60vh; overflow-y: auto; padding: 6px 0; }
.feed-line { display: flex; gap: 10px; padding: 5px 14px; font-family: var(--mono); font-size: 12.5px; border-bottom: 1px solid var(--border); align-items: baseline; }
.feed-line:last-child { border-bottom: none; }
.feed-line.fresh { animation: flash 1.2s ease-out; }
@keyframes flash { 0% { background: var(--accent-soft); } 100% { background: transparent; } }
.feed-time { color: var(--faint); white-space: nowrap; }
.feed-kind { flex-shrink: 0; width: 96px; text-align: center; padding: 1px 8px; border-radius: 999px; font-size: 10.5px; font-weight: 700; letter-spacing: .5px; }
.feed-kind.sensor { background: var(--info-soft); color: var(--info); }
.feed-kind.alert { background: var(--danger-soft); color: var(--danger); }
.feed-kind.status, .feed-kind.assign { background: var(--warn-soft); color: var(--warn); }
.feed-kind.note { background: var(--panel-2); color: var(--muted); border: 1px solid var(--border); }
.feed-kind.action { background: var(--accent-soft); color: var(--accent-text); }
.feed-kind.ai { background: var(--accent-soft); color: var(--accent-text); border: 1px dashed var(--accent); }
.feed-kind.rule { background: var(--info-soft); color: var(--info); border: 1px dashed var(--info); }
.feed-sensor { color: var(--muted); white-space: nowrap; }
.feed-text { word-break: break-all; }

.analysis-box { background: var(--panel-2); border: 1px solid var(--border); border-left: 3px solid var(--accent); border-radius: 8px; padding: 12px 14px; margin: 10px 0; font-size: 13px; white-space: pre-wrap; word-break: break-word; }
.analysis-meta { font-size: 11px; color: var(--faint); margin-top: 8px; font-family: var(--mono); white-space: normal; }

.auth-wrap { max-width: 400px; margin: 8vh auto 0; }
.auth-wrap .panel { padding: 28px; }
.auth-wrap h2 { font-size: 18px; margin-bottom: 4px; }
.auth-wrap .sub { color: var(--muted); font-size: 13px; margin-bottom: 18px; }
.auth-wrap label { display: block; font-size: 12px; color: var(--muted); margin: 12px 0 4px; font-weight: 600; }
.auth-wrap input { width: 100%; }
.auth-wrap .btn { width: 100%; margin-top: 18px; }
.auth-err { color: var(--danger); font-size: 13px; margin-top: 10px; min-height: 18px; }
.auth-switch { text-align: center; margin-top: 14px; font-size: 13px; color: var(--muted); }

.settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 16px; align-items: start; }
@media (max-width: 1000px) { .settings-grid { grid-template-columns: 1fr; } }
.settings-grid .panel { padding: 18px; }
.switch-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border); }
.switch-row:last-child { border-bottom: none; }
.switch-row .desc { font-size: 12px; color: var(--muted); margin-top: 2px; }
.toggle { position: relative; width: 44px; height: 24px; border-radius: 999px; border: 1px solid var(--border-strong); background: var(--panel-2); cursor: pointer; flex-shrink: 0; transition: background .15s; }
.toggle::after { content: ''; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: var(--faint); transition: left .15s, background .15s; }
.toggle.on { background: var(--accent); border-color: var(--accent); }
.toggle.on::after { left: 22px; background: #fff; }
.form-row { margin: 12px 0; }
.form-row label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; font-weight: 600; }
.form-row input { width: 100%; }
.live-pill { border-color: var(--accent); color: var(--accent-text); background: var(--accent-soft); font-weight: 700; }
.user-menu { display: flex; align-items: center; gap: 10px; font-size: 13px; }
.link-btn { background: none; border: none; color: var(--info); cursor: pointer; font-size: 13px; padding: 0; }

/* --- attack surface map --------------------------------------------------- */
.map-toolbar { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin: 16px 0 12px; }
.map-toolbar .tl { flex: 1; min-width: 220px; display: flex; align-items: center; gap: 10px; }
.map-toolbar input[type="range"] { flex: 1; accent-color: var(--accent); }
.map-toolbar .tl-time { font-family: var(--mono); font-size: 12px; color: var(--muted); white-space: nowrap; }
.map-grid { display: grid; grid-template-columns: 1fr 340px; gap: 16px; align-items: start; }
@media (max-width: 1100px) { .map-grid { grid-template-columns: 1fr; } }
.map-canvas { padding: 16px; min-height: 300px; }
.map-subnet { margin-bottom: 18px; }
.map-subnet h5 { font-size: 11px; letter-spacing: 1px; color: var(--muted); font-weight: 600; margin-bottom: 8px; font-family: var(--mono); }
.map-hosts { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 8px; }
.map-host { border: 1px solid var(--border); border-left: 3px solid var(--faint); border-radius: 8px; padding: 8px 10px; cursor: pointer; background: var(--panel-2); transition: border-color .15s, opacity .3s; }
.map-host:hover { border-color: var(--border-strong); }
.map-host.sel { outline: 2px solid var(--accent); outline-offset: -1px; }
.map-host.st-active { border-left-color: var(--accent); }
.map-host.st-silent { border-left-color: var(--warn); }
.map-host.st-changed { border-left-color: var(--danger); background: var(--danger-soft); }
.map-host.st-offline { border-left-color: var(--faint); border-style: dashed; opacity: .55; }
.map-host .ip { font-family: var(--mono); font-size: 13px; font-weight: 600; }
.map-host .meta { font-size: 10.5px; color: var(--faint); margin-top: 1px; }
.map-svcs { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.map-svc { font-family: var(--mono); font-size: 10px; padding: 1px 6px; border-radius: 999px; border: 1px solid var(--border-strong); color: var(--muted); background: var(--panel); }
.map-svc.silent { opacity: .5; text-decoration: line-through; }
.map-side .panel { padding: 14px; }
.map-ev { display: flex; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 12px; align-items: baseline; }
.map-ev:last-child { border-bottom: none; }
.map-ev .t { font-family: var(--mono); font-size: 10.5px; color: var(--faint); white-space: nowrap; }
.map-ev .dot { flex-shrink: 0; margin-top: 4px; }
.map-ev .txt { word-break: break-word; }
.map-legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 11px; color: var(--muted); margin-top: 10px; }
.map-legend span { display: inline-flex; align-items: center; gap: 5px; }
.map-legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.map-ev-list { max-height: 55vh; overflow-y: auto; }
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="logo">∿</span>
    <b>Silence on the Wire</b>
  </div>
  <nav class="tabs" style="padding:0">
    <button class="tab" data-nav="alerty" onclick="go('#/alerty')">Alerty</button>
    <button class="tab" data-nav="mapa" onclick="go('#/mapa')">Mapa</button>
    <button class="tab" data-nav="ekspozycja" onclick="go('#/ekspozycja')">Ekspozycja</button>
    <button class="tab" data-nav="logi" onclick="go('#/logi')">Logi live</button>
    <button class="tab" data-nav="sensory" onclick="go('#/sensory')">Sensory</button>
    <button class="tab" data-nav="reguly" onclick="go('#/reguly')">Reguły</button>
    <button class="tab" data-nav="ustawienia" onclick="go('#/ustawienia')">Ustawienia</button>
    <button class="tab" data-nav="role" id="tabRole" onclick="go('#/role')" hidden>Role</button>
  </nav>
  <div class="spacer"></div>
  <button class="theme-toggle" id="themeToggle" title="Przełącz motyw">☾</button>
  <span class="demo-badge" id="demoBadge" hidden>DANE DEMO</span>
  <span class="pill live-pill" id="livePill" hidden><span class="dot green"></span> LIVE · tylko edge</span>
  <span class="pill" id="sensorPill"><span class="dot gray"></span> Sensor: …</span>
  <span class="clock" id="clock">akt. --:--:--</span>
  <div class="user-menu"><span class="avatar" id="userAvatar">…</span> <span id="userName">…</span> <button class="link-btn" onclick="doLogout()" title="Wyloguj">wyloguj</button></div>
</header>

<main class="page" id="app"></main>

<script src="rbac.js"></script>
<script>
const $ = (sel, el=document) => el.querySelector(sel);
const api = (path, opts) => fetch(path, opts).then(async r => {
  if (!r.ok) {
    const err = new Error((await r.text()) || r.status);
    err.status = r.status;
    if (r.status === 401 && !path.startsWith('/api/me') && !path.startsWith('/api/login') && !path.startsWith('/api/register')) {
      session.user = null;
      renderAuth();
    }
    throw err;
  }
  return r.status === 204 ? null : r.json();
});
const post = (path, body) => api(path, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtTime = t => t ? new Date(t).toLocaleTimeString('pl-PL', {hour:'2-digit',minute:'2-digit',second:'2-digit'}) : '—';
const fmtDateTime = t => t ? new Date(t).toLocaleString('pl-PL', {day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}) : '—';

const STATUS = {
  nowe:           {label:'NOWE',           dot:'green'},
  do_weryfikacji: {label:'DO WERYFIKACJI', dot:'orange'},
  potwierdzony:   {label:'POTWIERDZONE',   dot:'red'},
  falszywy_alarm: {label:'FAŁSZYWE ALARMY',dot:'gray'},
  zamkniety:      {label:'ZAMKNIĘTE',      dot:'gray'},
};
const STATUS_BTN = {nowe:'Nowy', do_weryfikacji:'Do weryfikacji', potwierdzony:'Potwierdzony', falszywy_alarm:'Fałszywy alarm', zamkniety:'Zamknięty'};

// --- theme -----------------------------------------------------------------
const themeBtn = $('#themeToggle');
function applyTheme(t) {
  document.documentElement.dataset.theme = t;
  themeBtn.textContent = t === 'dark' ? '☀' : '☾';
  localStorage.setItem('sotw-theme', t);
}
applyTheme(localStorage.getItem('sotw-theme') || 'light');
themeBtn.onclick = () => applyTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');

// --- state -----------------------------------------------------------------
const state = {
  sensors: [], summary: null, ai: null,
  alerts: {items: [], total: 0, page: 1, per_page: 20},
  filters: {q: '', sensor: '', type: '', status: ''},
  sensorFilters: {q: '', status: ''},
  sensorPage: 1,
  logs: {items: [], lastSeq: 0, paused: false, sensor: ''},
  config: null,
  loading: true, sensorOnline: null, error: null,
};
const session = {user: null, hasUsers: true, registrationOpen: true};
let ACTOR = 'operator';

function go(hash) { location.hash = hash; }
window.addEventListener('hashchange', render);

// --- auth ------------------------------------------------------------------
function renderAuth(mode) {
  // mode: undefined = zachowaj dotychczasowy, 'login' | 'register'
  const hasUsers = session.hasUsers;
  const m = mode || (hasUsers ? 'login' : 'register');
  const app = $('#app');
  document.querySelector('.topbar').style.display = 'none';
  const isSetup = !hasUsers;
  app.innerHTML = `
    <div class="auth-wrap">
      <div class="panel">
        <h2>∿ Silence on the Wire</h2>
        <div class="sub">${isSetup ? 'Pierwsze uruchomienie — utwórz konto administratora konsoli.' : (m === 'register' ? 'Załóż konto operatora.' : 'Zaloguj się do konsoli operatora.')}</div>
        ${m === 'register' ? `
          <label>LOGIN</label><input id="authLogin" autocomplete="username" placeholder="np. j.baumgart">
          <label>IMIĘ I NAZWISKO</label><input id="authName" placeholder="np. Janek Baumgart">
          <label>HASŁO (min. 6 znaków)</label><input id="authPass" type="password" autocomplete="new-password">
          <button class="btn primary" onclick="doRegister()">${isSetup ? 'Utwórz konto administratora' : 'Zarejestruj'}</button>
          ${hasUsers ? '<div class="auth-switch">Masz konto? <button class="link-btn" onclick="renderAuth(\'login\')">Zaloguj się</button></div>' : ''}
        ` : `
          <label>LOGIN</label><input id="authLogin" autocomplete="username" autofocus>
          <label>HASŁO</label><input id="authPass" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">

// --- data loading ----------------------------------------------------------
async function refresh() {
  try {
    const [summary, sensors, ai] = await Promise.all([
      api('/api/summary'), api('/api/sensors?per_page=200'),
      api('/api/ai/status').catch(() => null),
    ]);
    state.summary = summary;
    state.sensors = sensors.items;
    state.ai = ai;
    state.sensorOnline = summary.sensors.offline === 0 ? true : (summary.sensors.online > 0 ? 'partial' : false);
    $('#demoBadge').hidden = !summary.demo;
    $('#livePill').hidden = !summary.live;
    updatePill();
    state.error = null;
  } catch (e) {
    state.error = e.message;
    state.sensorOnline = false;
    updatePill();
  }
  state.loading = false;
}
function updatePill() {
  const p = $('#sensorPill');
  const s = state.summary?.sensors;
  if (state.sensorOnline === true) p.innerHTML = `<span class="dot green"></span> Sensory: połączone (${s.online}/${s.total})`;
  else if (state.sensorOnline === 'partial') p.innerHTML = `<span class="dot orange"></span> Sensory: ${s.online}/${s.total} online`;
  else p.innerHTML = `<span class="dot red"></span> Sensory: brak połączenia`;
}
async function loadAlerts() {
  const f = state.filters;
  const params = new URLSearchParams({page: state.alerts.page, per_page: state.alerts.per_page});
  for (const k of ['q','sensor','type','status']) if (f[k]) params.set(k, f[k]);
  state.alerts = await api('/api/alerts?' + params);
}

const KIND_LABEL = {sensor:'SENSOR', alert:'ALERT', status:'STATUS', assign:'PRZYPISANIE', note:'NOTATKA', action:'AKCJA', ai:'AI', rule:'REGUŁA'};
async function pollLogs() {
  const l = state.logs;
  if (l.paused) return;
  try {
    const data = await api('/api/logs?since=' + l.lastSeq + '&limit=200');
    if (data.items.length) {
      l.items.push(...data.items.map(e => ({...e, fresh: true})));
      if (l.items.length > 400) l.items = l.items.slice(-400);
      l.lastSeq = data.last_seq;
      if (location.hash.startsWith('#/logi')) renderLogs();
    } else {
      l.lastSeq = data.last_seq;
    }
  } catch (e) { /* feed is best-effort; next tick retries */ }
}
function renderLogs() {
  const l = state.logs;
  const app = $('#app');
  const items = l.sensor ? l.items.filter(e => e.sensor === l.sensor) : l.items;
  const sensorOptions = [...new Set(l.items.map(e => e.sensor).filter(Boolean))].sort()
    .map(s => `<option value="${esc(s)}" ${l.sensor===s?'selected':''}>${esc(s)}</option>`).join('');
  const ai = state.ai;
  app.innerHTML = `
    <div class="feed-toolbar">
      <button class="btn" onclick="state.logs.paused=!state.logs.paused;renderLogs()">${l.paused ? '▶ Wznów' : '⏸ Wstrzymaj'}</button>
      <select onchange="state.logs.sensor=this.value;renderLogs()">
        <option value="">Wszystkie sensory</option>${sensorOptions}
      </select>
      <button class="btn" onclick="state.logs.items=[];state.logs.lastSeq=0;pollLogs().then(renderLogs)">Odśwież od początku</button>
      <span class="pill"><span class="dot ${l.paused?'orange':'green'}"></span> ${l.paused ? 'wstrzymane' : 'na żywo'} · ${items.length} wpisów</span>

// --- rules engine ----------------------------------------------------------
const splitCsv = s => String(s||'').split(',').map(x => x.trim()).filter(Boolean);
const splitPorts = s => splitCsv(s).map(Number).filter(n => Number.isInteger(n) && n > 0 && n < 65536);

async function viewRules() {
  const app = $('#app');
  app.innerHTML = skeleton();
  let data;
  try { data = await api('/api/rules'); }
  catch (e) { app.innerHTML = `<div class="panel" style="padding:24px;margin-top:16px">Nie udało się pobrać reguł: ${esc(e.message)}</div>`; return; }
  state.rules = data.items || [];
  state.ruleMode = !!data.rule_mode;
  const isAdmin = !!session.user?.admin;
  renderRules(isAdmin);
}

      </div>
    </div>`;
}
function addRule() {
  state.rules.push({id:'', name:'Nowa reguła', enabled:true, event_types:[], ports:[], ip_match:'', sensor_id:'', reasons:[], min_score:null, unresolved:null, set_status:'do_weryfikacji', action:'', assign:'', note:''});
  renderRules(true);
}
function moveRule(i, d) {
  const j = i + d;
  if (j < 0 || j >= state.rules.length) return;
  [state.rules[i], state.rules[j]] = [state.rules[j], state.rules[i]];
  renderRules(true);
}
function delRule(i) {
  if (!confirm(`Usunąć regułę „${state.rules[i].name}”?`)) return;
  state.rules.splice(i, 1);
  renderRules(true);
}
async function saveRules() {
  try {
    await api('/api/rules', {method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify({items: state.rules})});
    viewRules();
  } catch (e) { alert('Nie udało się zapisać reguł: ' + e.message); }
}
async function applyRulesNow(btn) {
  btn.disabled = true;
  try {
    const r = await post('/api/rules/apply', {});
    alert(`Silnik reguł: ${r.triaged} dopasowanych z ${r.scanned} otwartych spraw.`);
    viewRules();
  } catch (e) { alert('Nie udało się zastosować reguł: ' + e.message); btn.disabled = false; }
}

  service_silent: {label: 'usługa zamilkła',        dot: 'orange'},
  gt_quiet:       {label: 'skan: zweryfikowany cichy', dot: 'green'},
  gt_changed:     {label: 'skan: ZMIANA w ciszy',   dot: 'red'},
  gt_unreachable: {label: 'skan: nieosiągalny',     dot: 'gray'},
  exposure_new:   {label: 'ekspozycja zewnętrzna',  dot: 'red'},
};

async function viewMap() {
  const app = $('#app');
  stopMapPlay();
  if (!mapState.data) {
    app.innerHTML = '<div class="loading-line"><div class="spinner"></div> Ładuję mapę powierzchni ataku…</div>';
    try { mapState.data = await api('/api/map'); }
    catch (e) { app.innerHTML = `<div class="empty"><h3>Nie udało się pobrać mapy</h3><p>${esc(e.message)}</p></div>`; return; }
  }
  const data = mapState.data;
  const events = (data.events || []).slice().sort((a, b) => new Date(a.time) - new Date(b.time));
  const hosts = data.hosts || [];
  if (!hosts.length && !events.length) {
    app.innerHTML = `<div class="empty"><div class="waves">∿∿∿</div>
      <h3>Mapa jest jeszcze pusta</h3>
      <p>Graf buduje się z pasywnego rejestru sensora — hosty i usługi pojawią się tutaj, gdy edge zacznie raportować zdarzenia.</p></div>`;
    return;
  }
  const tMin = events.length ? new Date(events[0].time).getTime()
    : Math.min(...hosts.map(h => new Date(h.first_seen).getTime()));
  const tMax = Date.now();
  if (mapState.t === null || mapState.t > tMax) mapState.t = tMax;
  const atLive = mapState.t >= tMax - 5000;

  app.innerHTML = `
    <div class="map-toolbar">
      <button class="btn" id="mapPlay">${mapState.playing ? '⏸ Pauza' : '▶ Odtwórz'}</button>
      <div class="tl">
        <input type="range" id="mapRange" min="${tMin}" max="${tMax}" step="1000" value="${mapState.t}">
        <span class="tl-time" id="mapTime"></span>
      </div>
      <button class="btn ${atLive ? 'primary' : ''}" id="mapLive">Na żywo</button>
      <button class="btn" id="mapReload">Odśwież dane</button>
    </div>
    <div class="map-grid">
      <div class="panel map-canvas" id="mapCanvas"></div>
      <div class="map-side"><div class="panel" id="mapSide"></div></div>
    </div>
    <div class="map-legend">
      <span><i style="background:var(--accent)"></i> aktywny</span>
      <span><i style="background:var(--warn)"></i> cichy pasywnie</span>
      <span><i style="background:var(--danger)"></i> zmiana wykryta skanem</span>
      <span><i style="background:var(--faint)"></i> nieosiągalny</span>
    </div>`;

  $('#mapRange').oninput = e => { mapState.t = parseInt(e.target.value, 10); mapState.selected = null; drawMap(); };
  $('#mapLive').onclick = () => { mapState.t = Date.now(); mapState.selected = null; drawMap(); };
  $('#mapReload').onclick = async () => { mapState.data = null; mapState.t = null; await viewMap(); };
  $('#mapPlay').onclick = () => toggleMapPlay(tMin);
  drawMap();
}

function toggleMapPlay(tMin) {
  if (mapState.playing) { stopMapPlay(); $('#mapPlay').textContent = '▶ Odtwórz'; return; }
  // At the live edge play restarts the drift story from the beginning.
  if (mapState.t >= Date.now() - 2000) mapState.t = tMin;
  mapState.playing = true;
  $('#mapPlay').textContent = '⏸ Pauza';
  const range = Date.now() - tMin;
  const step = Math.max(range / 150, 1000);
  mapState.timer = setInterval(() => {
    mapState.t += step;
    if (mapState.t >= Date.now()) { mapState.t = Date.now(); stopMapPlay(); const b = $('#mapPlay'); if (b) b.textContent = '▶ Odtwórz'; }
    drawMap();
  }, 120);
}
function stopMapPlay() {
  mapState.playing = false;
  if (mapState.timer) { clearInterval(mapState.timer); mapState.timer = null; }
}

// mapReplay folds the journal up to time T into per-host states.
function mapReplay(events, hosts, T) {
  const st = {};
  const ensure = ip => st[ip] || (st[ip] = {status: 'active', services: {}, sensor: '', gt: ''});
  for (const ev of events) {
    if (new Date(ev.time).getTime() > T) break;
    const h = ensure(ev.ip);
    if (ev.sensor_id) h.sensor = ev.sensor_id;
    const key = ev.port ? ev.port + '/' + (ev.proto || 'tcp') : '';
    switch (ev.type) {
      case 'host_new': h.status = 'active'; break;
      case 'host_silent': if (h.status !== 'changed') h.status = 'silent'; break;
      case 'host_active': h.status = 'active'; h.gt = ''; break;
      case 'service_new': h.services[key] = {silent: false}; break;
      case 'service_silent': if (key) h.services[key] = {silent: true}; break;
      case 'gt_quiet': h.gt = 'zweryfikowany_cichy'; if (h.status === 'changed') h.status = 'silent'; break;
      case 'gt_changed': h.status = 'changed'; h.gt = ev.detail || 'zmieniony'; break;
      case 'gt_unreachable': h.status = 'offline'; h.gt = 'nieosiągalny'; break;
    }
  }
  // Hosts recorded before the timeline existed still deserve a place: show
  // them with their registry state once their first_seen is reached.
  for (const h of hosts) {
    if (st[h.ip] || new Date(h.first_seen).getTime() > T) continue;
    const e = ensure(h.ip);
    e.sensor = h.sensor_id;
    e.status = h.check_verdict === 'nieosiągalny' ? 'offline'
      : h.check_verdict === 'zmieniony' ? 'changed'
      : h.silent_since ? 'silent' : 'active';
    e.gt = h.check_verdict || '';
    for (const [key, svc] of Object.entries(h.services || {})) e.services[key] = {silent: false};
  }
  return st;
}

function drawMap() {
  const data = mapState.data;
  if (!data) return;
  const events = (data.events || []).slice().sort((a, b) => new Date(a.time) - new Date(b.time));
  const hosts = data.hosts || [];
  const T = mapState.t;
  const st = mapReplay(events, hosts, T);

  const timeEl = $('#mapTime');
  if (timeEl) timeEl.textContent = new Date(T).toLocaleString('pl-PL', {day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit'});
  const range = $('#mapRange');
  if (range && parseInt(range.value, 10) !== T) range.value = T;

  // Group by /24 (v4) so hundreds of hosts stay scannable.
  const subnets = {};
  Object.entries(st).forEach(([ip, h]) => {
    const parts = ip.split('.');
    const net = parts.length === 4 ? parts.slice(0, 3).join('.') + '.0/24' : ip;
    (subnets[net] = subnets[net] || []).push([ip, h]);
  });
  const canvas = $('#mapCanvas');
  const nets = Object.keys(subnets).sort();
  canvas.innerHTML = nets.length ? nets.map(net => `
    <div class="map-subnet">
      <h5>${esc(net)} · ${subnets[net].length} hostów</h5>
      <div class="map-hosts">${subnets[net].sort((a, b) => a[0].localeCompare(b[0], undefined, {numeric: true})).map(([ip, h]) => {
        const svcs = Object.entries(h.services).sort((a, b) => parseInt(a[0]) - parseInt(b[0]));
        return `<div class="map-host st-${h.status} ${mapState.selected === ip ? 'sel' : ''}" onclick="mapSelect('${ip}')">
          <div class="ip">${esc(ip)}</div>
          <div class="meta">${esc(h.sensor || '')}${h.gt ? ' · ' + esc(h.gt).slice(0, 60) : ''}</div>
          ${svcs.length ? `<div class="map-svcs">${svcs.map(([k, s]) => `<span class="map-svc ${s.silent ? 'silent' : ''}">${esc(k)}</span>`).join('')}</div>` : ''}
        </div>`;
      }).join('')}</div>
    </div>`).join('')
    : '<div class="empty"><h3>Brak hostów w tym punkcie czasu</h3><p>Przesuń oś czasu dalej — sieć pojawi się wraz z pierwszymi zdarzeniami.</p></div>';

  // Side panel: selected host details or the event journal around T.
  const side = $('#mapSide');
  if (mapState.selected && st[mapState.selected]) {
    const ip = mapState.selected;
    const h = st[ip];
    const rec = hosts.find(x => x.ip === ip) || {};
    const hostEvs = events.filter(e => e.ip === ip && new Date(e.time).getTime() <= T).slice(-30).reverse();
    side.innerHTML = `
      <h4 style="font-size:11px;letter-spacing:1px;color:var(--muted);margin-bottom:10px">HOST ${esc(ip)} <button class="link-btn" style="float:right" onclick="mapSelect(null)">zamknij</button></h4>
      <div class="kv">
        <dt>Stan (o ${new Date(T).toLocaleTimeString('pl-PL')})</dt><dd>${esc(h.status)}</dd>
        <dt>Sensor</dt><dd>${esc(h.sensor || '—')}</dd>
        <dt>Pierwszy kontakt</dt><dd>${fmtDateTime(rec.first_seen)}</dd>
        <dt>Ostatni kontakt</dt><dd>${fmtDateTime(rec.last_seen)}</dd>
        ${h.gt ? `<dt>Werdykt skanu</dt><dd>${esc(h.gt)}</dd>` : ''}
      </div>
      <h4 style="font-size:11px;letter-spacing:1px;color:var(--muted);margin:12px 0 6px">HISTORIA HOSTA</h4>
      <div class="map-ev-list">${hostEvs.length ? hostEvs.map(e => mapEvLine(e)).join('') : '<p class="fineprint">Brak zdarzeń do tego momentu.</p>'}</div>`;
  } else {
    const visible = events.filter(e => new Date(e.time).getTime() <= T).slice(-100).reverse();
    side.innerHTML = `
      <h4 style="font-size:11px;letter-spacing:1px;color:var(--muted);margin-bottom:10px">OŚ CZASU · ${visible.length} zdarzeń</h4>
      <div class="map-ev-list">${visible.length ? visible.map(e => mapEvLine(e)).join('') : '<p class="fineprint">Brak zdarzeń przed tym momentem.</p>'}</div>`;
  }
}

function mapEvLine(e) {
  const meta = MAP_EV[e.type] || {label: e.type, dot: 'gray'};
  const svc = e.port ? ':' + e.port + (e.proto ? '/' + e.proto : '') : '';
  return `<div class="map-ev">
    <span class="t">${new Date(e.time).toLocaleString('pl-PL', {day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit'})}</span>
    <span class="dot ${meta.dot}"></span>
    <span class="txt"><b>${esc(meta.label)}</b> ${esc(e.ip)}${esc(svc)}${e.detail ? ' — ' + esc(e.detail).slice(0, 120) : ''}</span>
  </div>`;
}

function mapSelect(ip) { mapState.selected = ip; drawMap(); }

// --- exposure (inside/outside correlation) ---------------------------------
const EXP_KIND = {
  unmatched_external: {label: 'BEZ ODPOWIEDNIKA WEWNĄTRZ', cls: 'potwierdzony'},
  exposed_internal:   {label: 'WEWNĘTRZNA WYSTAWIONA',     cls: 'potwierdzony'},
  new_external:       {label: 'NOWA NA PUBLICZNYM IP',     cls: 'do_weryfikacji'},
  favicon_spread:     {label: 'FAVICON NA INNYCH IP',      cls: 'do_weryfikacji'},
  gone_external:      {label: 'ZNIKNĘŁA Z INTERNETU',      cls: 'zamkniety'},
};

async function viewExposure() {
  const app = $('#app');
  app.innerHTML = '<div class="loading-line"><div class="spinner"></div> Ładuję korelację z widokiem zewnętrznym…</div>';
  let d;
  try { d = await api('/api/exposure'); }
  catch (e) { app.innerHTML = `<div class="empty"><h3>Nie udało się pobrać danych ekspozycji</h3><p>${esc(e.message)}</p></div>`; return; }

  if (!d.configured) {
    app.innerHTML = `<div class="empty"><div class="waves">⇄</div>
      <h3>Korelacja z internetem nie jest skonfigurowana</h3>
      <p>Sensor widzi sieć od środka; Shodan/Censys widzą, co z niej wystawione jest na świat. Dodaj klucz API w Ustawieniach, a diff „wnętrze vs internet" zacznie wykrywać shadow IT i przypadkowe ekspozycje.</p>
      ${session.user?.admin ? '<button class="btn primary" onclick="go(\'#/ustawienia\')">Przejdź do ustawień</button>' : '<p class="fineprint">Skonfigurować może administrator.</p>'}</div>`;
    return;
  }

  const view = d.view || null;
  const findings = d.findings || [];
  const byKind = k => findings.filter(f => f.kind === k);
  const isAdmin = !!session.user?.admin;

  app.innerHTML = `
    <div class="cards">
      <div class="card panel"><div class="label">PUBLICZNE IP</div><div class="value" style="font-size:20px;font-family:var(--mono)">${esc(view?.ip || '—')}</div><div class="sub">${esc(d.provider)}${view?.org ? ' · ' + esc(view.org) : ''}</div></div>
      <div class="card panel"><div class="label">USŁUGI Z INTERNETU</div><div class="value">${view ? view.services.length : '—'}</div><div class="sub">${view?.last_update ? 'akt. ' + esc(view.last_update.slice(0, 10)) : ''}</div></div>
      <div class="card panel"><div class="label">BEZ ODPOWIEDNIKA</div><div class="value" style="color:var(--danger)">${byKind('unmatched_external').length}</div><div class="sub">shadow IT / przypadkowa ekspozycja</div></div>
      <div class="card panel"><div class="label">WEWN. WYSTAWIONE</div><div class="value" style="color:var(--warn)">${byKind('exposed_internal').length}</div><div class="sub">nowe wewnątrz + widoczne z świata</div></div>
    </div>
    <div class="feed-toolbar">
      <span class="muted">${d.enabled ? `Włączone · co ${esc(d.interval || '—')}` : 'Wyłączone — tylko kontrole ręczne'}${d.running ? ' · <b>kontrola w toku…</b>' : ''}</span>
      <span style="flex:1"></span>
      ${isAdmin ? `<button class="btn" onclick="runExposure()">Uruchom kontrolę teraz</button>` : ''}
      <button class="btn" onclick="viewExposure()">Odśwież</button>
    </div>
    ${d.last_summary ? `<p class="fineprint" style="margin-bottom:12px">Ostatnia kontrola: ${esc(d.last_summary)}</p>` : ''}
    ${view?.vulns?.length ? `<div class="banner"><span>⚠</span><div class="grow">${esc(d.provider)} raportuje na tym adresie ${view.vulns.length} znanych CVE: ${esc(view.vulns.slice(0, 8).join(', '))}${view.vulns.length > 8 ? '…' : ''}</div></div>` : ''}
    <div class="detail" style="grid-template-columns:1fr 1fr">
      <div class="panel">
        <h4>WIDOK ZEWNĘTRZNY (${esc(d.provider)})</h4>
        ${view && view.services.length ? `<table><thead><tr><th>Usługa</th><th>Produkt</th><th>Odpowiednik wewnętrzny</th></tr></thead>
        <tbody>${view.services.map(s => {
          const f = findings.find(x => x.service.port === s.port && (x.kind === 'unmatched_external' || x.kind === 'exposed_internal'));
          return `<tr style="cursor:default"><td class="mono">${s.port}/${esc(s.proto || 'tcp')}${s.favicon_mmh3 ? ` <span class="fineprint">favicon ${s.favicon_mmh3}</span>` : ''}</td>
            <td>${esc((s.product || '') + ' ' + (s.version || '')) || '<span class="muted">—</span>'}</td>
            <td>${f && f.kind === 'unmatched_external' ? '<span class="badge potwierdzony">BRAK — shadow IT?</span>'
              : f && f.match_ip ? `<span class="badge nowe">${esc(f.match_ip)}</span>`
              : '<span class="muted">—</span>'}</td></tr>`;
        }).join('')}</tbody></table>` : '<p class="muted" style="padding:14px">Brak danych — uruchom kontrolę.</p>'}
      </div>
      <div class="panel">
        <h4>WYNIKI DIFFU „WNĘTRZE vs INTERNET"</h4>
        ${findings.length ? `<div class="feed" style="max-height:50vh">${findings.map(f => {
          const k = EXP_KIND[f.kind] || {label: f.kind, cls: 'zamkniety'};
          return `<div class="feed-line"><span class="feed-kind ${f.kind === 'gone_external' ? 'note' : f.kind === 'new_external' || f.kind === 'favicon_spread' ? 'status' : 'alert'}" style="width:auto">${esc(k.label)}</span>
            <span class="feed-text"><b class="mono">${f.service.port}/${esc(f.service.proto || 'tcp')}</b> ${esc((f.service.product || '') + ' ' + (f.service.version || ''))}${f.match_ip ? ' ↔ ' + esc(f.match_ip) : ''}<br><span class="muted">${esc(f.detail)}</span> <span class="feed-time">${fmtDateTime(f.first_seen)}</span></span></div>`;
        }).join('')}</div>` : '<p class="muted" style="padding:14px">Brak rozjazdu widoków — wnętrze i internet mówią to samo.</p>'}
      </div>
    </div>`;
}

async function runExposure() {
  try {
    await post('/api/exposure/run', {});
    alert('Kontrola ekspozycji uruchomiona — wynik pojawi się za chwilę.');
    setTimeout(viewExposure, 3000);
  } catch (e) { alert('Nie udało się uruchomić: ' + e.message); }
}

// --- router ----------------------------------------------------------------
async function render() {
  if (!session.user) return; // auth screen is up
  const h = location.hash || '#/alerty';
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active',
    h.startsWith('#/sensory') ? t.dataset.nav === 'sensory'
    : h.startsWith('#/mapa') ? t.dataset.nav === 'mapa'
    : h.startsWith('#/ekspozycja') ? t.dataset.nav === 'ekspozycja'
    : h.startsWith('#/logi') ? t.dataset.nav === 'logi'
    : h.startsWith('#/reguly') ? t.dataset.nav === 'reguly'
    : h.startsWith('#/ustawienia') ? t.dataset.nav === 'ustawienia'
    : t.dataset.nav === 'alerty'));
  if (h.startsWith('#/mapa')) return viewMap();
  if (h.startsWith('#/ekspozycja')) return viewExposure();
  if (h.startsWith('#/sensory')) return viewSensors();
  if (h.startsWith('#/logi')) return viewLogs();
  if (h.startsWith('#/reguly')) return viewRules();
  if (h.startsWith('#/ustawienia')) return viewSettings();
  if (h.startsWith('#/role')) return viewRoles();
  if (h.startsWith('#/alerta/')) return viewAlert(decodeURIComponent(h.slice(9)));
  return viewAlerts();
}

setInterval(() => { $('#clock').textContent = 'akt. ' + new Date().toLocaleTimeString('pl-PL'); }, 1000);
setInterval(async () => { if (!session.user) return; await refresh(); if (!location.hash.startsWith('#/alerta/') && !location.hash.startsWith('#/logi') && !location.hash.startsWith('#/ustawienia') && !location.hash.startsWith('#/reguly') && !location.hash.startsWith('#/mapa') && !location.hash.startsWith('#/ekspozycja') && !location.hash.startsWith('#/role')) render(); }, 10000);
setInterval(() => { if (session.user) pollLogs(); }, 3000);

(async () => {
  try {
    const me = await api('/api/me');
    session.hasUsers = me.has_users;
    session.registrationOpen = me.registration_open !== false;
    if (me.authenticated) return enterApp(me);
  } catch (e) {}
  renderAuth();
})();
</script>
